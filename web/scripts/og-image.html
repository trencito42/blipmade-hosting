<!-- The picture that a link of the site shows when it is shared.
     It is drawn by a browser, because a picture is a picture and not a
     stylesheet:  npm run og
     The typefaces come from the packages of the site, the logo from
     public/favicon.svg. The two files of the typeface are copied next to this
     file before the picture is taken. -->
<html><head><meta charset="utf-8"><style>
@font-face{font-family:"Hanken Grotesk Variable";src:url("hanken-grotesk-latin-wght-normal.woff2") format("woff2");font-weight:100 900;font-display:block}
@font-face{font-family:"Funnel Display Variable";src:url("funnel-display-latin-wght-normal.woff2") format("woff2");font-weight:100 900;font-display:block}
html,body{margin:0;padding:0;width:1200px;height:630px;overflow:hidden}
body{background:#090b0a;color:#f1f5ef;font-family:"Hanken Grotesk Variable",system-ui,sans-serif;position:relative}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:60px 60px}
.glow{position:absolute;width:820px;height:820px;right:-260px;top:-320px;border-radius:50%;background:radial-gradient(circle,rgba(78,229,149,.20),rgba(78,229,149,0) 62%)}
.wrap{box-sizing:border-box;position:relative;padding:64px 80px;display:flex;flex-direction:column;justify-content:space-between;height:630px}
.brand{display:flex;align-items:center;gap:18px}
.brand img{height:62px;width:auto;display:block}
.brand span{font-family:"Funnel Display Variable",sans-serif;font-size:46px;font-weight:600;letter-spacing:-.03em}
h1{font-family:"Funnel Display Variable",sans-serif;font-size:74px;line-height:.96;font-weight:600;letter-spacing:-.05em;margin:0;max-width:15ch}
p{margin:22px 0 0;font-size:25px;line-height:1.4;color:#b5c0b8;max-width:26ch}
.foot{display:flex;align-items:center;gap:14px;font-size:20px;color:#8c988f}
.chip{border:1px solid #2c3b31;background:#121915;border-radius:999px;padding:11px 22px;color:#eef2ec;font-weight:600}
.chip.mint{background:#6be598;color:#121915;border-color:#6be598}
.dot{width:12px;height:12px;border-radius:50%;background:#4ee595;display:inline-block}
</style></head>
<body>
<div class="grid"></div><div class="glow"></div>
<div class="wrap">
  <div class="brand"><img src="logo.svg" alt=""><span>blipmade</span></div>
  <div>
    <h1>Hosting for everything you run.</h1>
    <p>Pick the RAM, the CPU and the disk. See the price as you go.</p>
  </div>
  <div class="foot"><span class="dot"></span><span class="chip mint">From €1.79 a month</span><span class="chip">One card of rates</span></div>
</div>
</body></html>
