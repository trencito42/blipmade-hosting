# Monitoring stack. See README.md. Pinned versions: update them on purpose.
services:
  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    # The token of the platform is written to a file the configuration reads, so it is not in the config.
    entrypoint: ['/bin/sh', '-c', 'printf %s "$$PLATFORM_METRICS_TOKEN" > /tmp/platform-token && exec /bin/prometheus --config.file=/etc/prometheus/prometheus.yml --storage.tsdb.retention.time=30d --storage.tsdb.path=/prometheus']
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    environment:
      PLATFORM_METRICS_TOKEN: ${PLATFORM_METRICS_TOKEN}
    ports: ['127.0.0.1:9090:9090']

  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    entrypoint: ['/bin/sh', '-c', 'printf %s "$$DISCORD_WEBHOOK_URL" > /tmp/discord-webhook && exec /bin/alertmanager --config.file=/etc/alertmanager/alertmanager.yml']
    volumes:
      - ./alertmanager:/etc/alertmanager:ro
    environment:
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL}
    ports: ['127.0.0.1:9093:9093']

  pve-exporter:
    image: prompve/prometheus-pve-exporter:3.4.2
    restart: unless-stopped
    environment:
      PVE_USER: ${PVE_USER}
      PVE_TOKEN_NAME: ${PVE_TOKEN_NAME}
      PVE_TOKEN_VALUE: ${PVE_TOKEN_VALUE}
      PVE_VERIFY_SSL: "false"

  blackbox:
    image: prom/blackbox-exporter:v0.25.0
    restart: unless-stopped
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro

  grafana:
    image: grafana/grafana:11.3.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports: ['127.0.0.1:3000:3000']

volumes:
  prometheus-data:
  grafana-data:
