route:
  receiver: discord
  group_by: [alertname, instance]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: discord
    slack_configs:
      # Discord understands the Slack format on the /slack end of the webhook.
      - api_url_file: /etc/alertmanager/discord-webhook
        send_resolved: true
        title: '{{ .CommonLabels.alertname }} ({{ .Status }})'
        text: '{{ range .Alerts }}{{ .Annotations.summary }}\n{{ end }}'
