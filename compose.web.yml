# The web container of the platform.
#
# The limits of the containers are here so that one container that leaks
# cannot take the whole machine with it. The machine has four processors and
# about 4.3 GB of memory that can be used, and the five containers of the
# platform share it. The limits of the five containers add up to less than
# that, so the database is never the one that is killed when everything grows
# at once.
#
# The logs are written by the driver of Docker with a size and a number of
# files, so they cannot fill the disk. A disk that is full takes PostgreSQL
# down, and PostgreSQL down takes the platform down.
services:
  web:
    build:
      context: ./web
      args:
        # Vite embeds the public GlitchTip project DSN in the browser build.
        # An empty value keeps reporting fully disabled in other environments.
        VITE_SENTRY_DSN: "${VITE_SENTRY_DSN:-}"
    restart: unless-stopped
    environment:
      NODE_ENV: production
      SERVER_PORT: 3000
      # The frontend is served from the same origin as the API, so the browser
      # never needs a cross-site cookie.
      API_URL: http://api:3100
      # The origin that receives the errors of the browser (GlitchTip), allowed by the content security policy.
      CONNECT_SRC_EXTRA: "${CONNECT_SRC_EXTRA:-}"
      # The addresses whose forwarding headers are believed. The gateway that
      # terminates the TLS is one of them, so the interface and the API know
      # that the visitor is on https and that the session cookie is protected.
      # Every other request is treated as coming straight from the visitor.
      TRUSTED_PROXY_IPS: "${TRUSTED_PROXY_IPS:-}"
    depends_on:
      - api
    ports:
      # Staging is reachable from the LAN so it can be reviewed before the
      # gateway route exists. The API stays on loopback; the web container
      # proxies /api to it.
      - "10.77.0.13:3000:3000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # The web container serves the files of the interface and forwards the
    # calls of the API. It holds no data of its own, so it is given a small
    # share of the memory of the machine: the files are read from the disk
    # and are not kept in the process.
    mem_limit: 384m
    # The web container is bound by the network and not by the processor. One
    # processor is more than it needs for the traffic of the platform.
    cpus: 1.0
    pids_limit: 256
    # The log of the web container records the requests of the visitors, so it
    # is the log that grows the fastest of the five. It is bounded like the
    # others.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
