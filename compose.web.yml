services:
  web:
    build:
      context: ./web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      SERVER_PORT: 3000
      # The frontend is served from the same origin as the API, so the browser
      # never needs a cross-site cookie.
      API_URL: http://api:3100
      # The Adobe Fonts web project of proxima nova. Leave it empty to keep the
      # Geist fallback; when it is set, the kit stylesheet is added to the head
      # of the page. Only https://use.typekit.net or https://p.typekit.net is
      # accepted. See docs/TYPOGRAPHY.md.
      ADOBE_FONTS_KIT_URL: "${ADOBE_FONTS_KIT_URL:-}"
      # The name of the family the kit declares, when the operator wants to
      # write it down instead of letting the server read the stylesheet. The
      # name is written exactly as Adobe writes it, for example "proxima-nova".
      ADOBE_FONTS_FAMILY: "${ADOBE_FONTS_FAMILY:-}"
      # The addresses whose forwarding headers are believed. The gateway that
      # terminates the TLS is one of them, so the interface and the API know
      # that the visitor is on https and that the session cookie is protected.
      # Every other request is treated as coming straight from the visitor.
      TRUSTED_PROXY_IPS: "${TRUSTED_PROXY_IPS:-}"
    depends_on:
      - api
    ports:
      # Staging is reachable from the LAN so it can be reviewed before the
      # gateway route exists. The API stays on loopback; the web container
      # proxies /api to it.
      - "10.77.0.13:3000:3000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
